<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珍珠珠宝精品目录</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1410;
  --gold: #b8924a;
  --gold2: #d4af6e;
  --gold3: #f0d898;
  --cream: #fdf8f0;
  --warm: #f5ede0;
  --warm2: #ede0cc;
  --light: #faf6ef;
  --border: rgba(184,146,74,0.2);
  --border2: rgba(184,146,74,0.45);
  --shadow: 0 8px 48px rgba(28,20,16,0.13);
  --shadow2: 0 2px 16px rgba(28,20,16,0.08);
  --text: #2d2218;
  --muted: #8a7060;
  --red: #c0392b;
}
*{margin:0;padding:0;box-sizing:border-box}

/* ─── Scrollbar ─── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--warm)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
}

/* ─── HERO ─── */
.hero {
  background: var(--ink);
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 24px 56px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content:'';position:absolute;inset:0;
  background: radial-gradient(ellipse 100% 80% at 50% -10%, rgba(184,146,74,0.22) 0%, transparent 65%),
              radial-gradient(ellipse 60% 40% at 80% 110%, rgba(184,146,74,0.1) 0%, transparent 60%);
}
.hero-tag {
  font-family:'Lato',sans-serif;
  font-size:11px;letter-spacing:.5em;
  color:var(--gold2);text-transform:uppercase;
  margin-bottom:22px;opacity:.9;position:relative;
}
.hero h1 {
  font-family:'Playfair Display',serif;
  font-size:clamp(38px,6vw,68px);
  font-weight:400;
  color:#f5ede0;
  letter-spacing:.06em;
  text-align:center;
  line-height:1.15;
  position:relative;
}
.hero h1 em{font-style:italic;color:var(--gold3)}
.hero-line{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  margin:24px auto 16px;
}
.hero-sub{
  font-family:'Lato',sans-serif;
  font-size:13px;letter-spacing:.18em;
  color:rgba(245,237,224,.45);
  position:relative;
}

/* ─── TOP BAR ─── */
.topbar {
  background:rgba(253,248,240,.97);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border2);
  padding:14px 32px;
  display:flex;gap:14px;align-items:center;
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 20px rgba(28,20,16,.08);
  flex-wrap:wrap;
}
.search-box{
  flex:1;min-width:180px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:9px 16px 9px 38px;
  border:1px solid var(--border2);
  border-radius:3px;
  background:white;
  font-family:inherit;font-size:13px;
  color:var(--text);outline:none;
  transition:border-color .2s;
}
.search-box input:focus{border-color:var(--gold)}
.search-box::before{
  content:'🔍';position:absolute;
  left:12px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.5;pointer-events:none;
}
.view-btns{display:flex;gap:6px}
.vbtn{
  padding:8px 14px;border:1px solid var(--border2);
  background:white;border-radius:3px;
  font-size:14px;cursor:pointer;
  transition:all .2s;color:var(--muted);
}
.vbtn.active,.vbtn:hover{background:var(--gold);border-color:var(--gold);color:white}
.filter-wrap{display:flex;gap:7px;flex-wrap:wrap}
.fbtn{
  padding:7px 15px;border:1px solid var(--border);
  background:white;border-radius:20px;
  font-family:inherit;font-size:12px;
  color:var(--muted);cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.fbtn:hover{border-color:var(--gold);color:var(--gold)}
.fbtn.active{background:var(--gold);border-color:var(--gold);color:white}
.count{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}

/* ─── GRID ─── */
.main{padding:40px 32px 64px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:28px;
}

/* ─── CARD ─── */
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  box-shadow:var(--shadow2);
  transition:transform .25s,box-shadow .25s;
  animation:fadeUp .4s ease both;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}

/* Image area */
.card-img{
  position:relative;
  background:var(--warm);
  height:220px;
  overflow:hidden;
  cursor:pointer;
}
.card-img img{
  width:100%;height:100%;
  object-fit:cover;
  transition:transform .4s;
}
.card:hover .card-img img{transform:scale(1.04)}
.card-img-placeholder{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;color:var(--muted);
  background:linear-gradient(135deg,#f5ede0,#ede0cc);
}
.card-img-placeholder .gem-icon{font-size:40px;opacity:.5}
.card-img-placeholder span{font-size:12px;letter-spacing:.08em}
.img-upload-overlay{
  position:absolute;inset:0;
  background:rgba(28,20,16,.55);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;opacity:0;transition:opacity .2s;
}
.card-img:hover .img-upload-overlay{opacity:1}
.img-upload-overlay span{
  font-size:13px;color:white;
  font-family:'Lato',sans-serif;letter-spacing:.08em;
}
.img-upload-overlay .upload-icon{font-size:28px}
.img-count-badge{
  position:absolute;top:10px;right:10px;
  background:rgba(28,20,16,.7);
  color:white;font-size:11px;
  padding:3px 8px;border-radius:12px;
  font-family:'Lato',sans-serif;
}
.img-nav{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;
}
.img-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.5);cursor:pointer;transition:background .2s;
}
.img-dot.active{background:white}
.img-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(28,20,16,.5);color:white;
  border:none;cursor:pointer;
  width:28px;height:28px;border-radius:50%;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:background .2s;z-index:2;
}
.img-arrow:hover{background:rgba(28,20,16,.8)}
.img-arrow.prev{left:8px}
.img-arrow.next{right:8px}
.cert-ribbon{
  position:absolute;top:12px;left:0;
  background:var(--gold);color:white;
  font-size:10px;padding:4px 12px 4px 10px;
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%);
  font-family:'Lato',sans-serif;letter-spacing:.06em;
  max-width:160px;
}

/* Card body */
.card-body{padding:20px 22px 0}
.card-no{
  font-family:'Playfair Display',serif;
  font-size:12px;color:var(--gold);
  letter-spacing:.1em;margin-bottom:6px;
  font-style:italic;
}
.card-name{
  font-size:16px;font-weight:600;
  color:var(--ink);margin-bottom:8px;
  line-height:1.4;
}
.card-spec{
  font-size:12px;color:var(--muted);
  line-height:1.6;margin-bottom:10px;
  border-left:2px solid var(--border2);
  padding-left:10px;
}
.card-desc{
  font-size:13px;color:#4a3828;
  line-height:1.7;margin-bottom:14px;
}
.card-footer{
  display:flex;align-items:center;
  justify-content:space-between;
  padding:12px 22px 14px;
  border-top:1px solid var(--border);
  gap:10px;
}
.card-price{
  font-family:'Playfair Display',serif;
  font-size:20px;font-weight:600;
  color:var(--gold);
}
.card-price.na{font-size:14px;color:var(--muted);font-style:italic}
.inquiry-btn{
  padding:8px 20px;
  background:var(--ink);color:var(--gold2);
  border:1px solid var(--border2);
  border-radius:3px;font-family:inherit;
  font-size:13px;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.inquiry-btn:hover{background:var(--gold);color:white;border-color:var(--gold)}

/* ─── LIST VIEW ─── */
.list-view{display:none}
.list-view.show{display:block}
.grid.show{display:none}
.list-table{
  width:100%;border-collapse:separate;border-spacing:0;
  background:white;border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow2);
}
.list-table thead{background:var(--ink)}
.list-table th{
  padding:14px 18px;
  font-family:'Lato',sans-serif;
  font-size:12px;letter-spacing:.12em;
  color:var(--gold2);text-align:left;
  font-weight:400;white-space:nowrap;
}
.list-table tbody tr{
  border-bottom:1px solid var(--border);
  transition:background .15s;
  animation:fadeUp .3s ease both;
}
.list-table tbody tr:hover{background:rgba(184,146,74,.04)}
.list-table td{
  padding:12px 18px;
  font-size:13px;vertical-align:middle;
}
.lt-thumb{
  width:60px;height:60px;
  border-radius:4px;object-fit:cover;
  background:var(--warm);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;overflow:hidden;
  flex-shrink:0;
}
.lt-thumb img{width:100%;height:100%;object-fit:cover}
.lt-name{font-weight:600;font-size:14px;color:var(--ink)}
.lt-spec{font-size:11px;color:var(--muted);margin-top:3px}
.lt-price{
  font-family:'Playfair Display',serif;
  font-size:16px;color:var(--gold);font-weight:600;
  white-space:nowrap;
}

/* ─── MODAL ─── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(28,20,16,.8);
  z-index:1000;align-items:center;justify-content:center;
  padding:20px;
  backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex}
.modal{
  background:white;border-radius:10px;
  max-width:680px;width:100%;
  max-height:92vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(28,20,16,.4);
  animation:modalIn .25s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.95) translateY(20px)}
  to{opacity:1;transform:none}
}
.modal-img-area{
  height:320px;background:var(--warm);
  position:relative;overflow:hidden;
}
.modal-img-area img{
  width:100%;height:100%;object-fit:cover;
}
.modal-img-placeholder{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;color:var(--muted);
  background:linear-gradient(135deg,var(--warm),var(--warm2));
}
.modal-img-placeholder .big-gem{font-size:64px;opacity:.35}
.modal-close{
  position:absolute;top:14px;right:14px;
  background:rgba(28,20,16,.6);color:white;
  border:none;width:34px;height:34px;
  border-radius:50%;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  z-index:2;transition:background .2s;
}
.modal-close:hover{background:rgba(28,20,16,.9)}
.modal-body{padding:28px 32px}
.modal-no{
  font-family:'Playfair Display',serif;
  font-size:12px;color:var(--gold);
  letter-spacing:.12em;font-style:italic;margin-bottom:6px;
}
.modal-name{
  font-size:22px;font-weight:600;color:var(--ink);
  margin-bottom:16px;line-height:1.3;
}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:14px;margin-bottom:20px;
}
.info-item label{
  display:block;font-size:10px;
  letter-spacing:.15em;color:var(--muted);
  text-transform:uppercase;margin-bottom:4px;
}
.info-item p{font-size:13px;color:var(--text);line-height:1.6}
.modal-price-row{
  display:flex;align-items:center;
  justify-content:space-between;
  padding:18px 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
}
.modal-price{
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:600;color:var(--gold);
}
.modal-price.na{font-size:16px;color:var(--muted);font-style:italic}
.modal-inquiry-btn{
  padding:11px 28px;
  background:var(--gold);color:white;
  border:none;border-radius:3px;
  font-family:inherit;font-size:14px;
  cursor:pointer;transition:all .2s;
}
.modal-inquiry-btn:hover{background:var(--gold2)}

/* Upload section */
.upload-section{
  margin-bottom:24px;
}
.upload-section h4{
  font-size:13px;letter-spacing:.08em;
  color:var(--muted);margin-bottom:12px;
  text-transform:uppercase;
}
.uploaded-imgs{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;
}
.img-thumb-wrap{
  position:relative;width:72px;height:72px;
}
.img-thumb-wrap img{
  width:100%;height:100%;object-fit:cover;
  border-radius:4px;border:2px solid var(--border2);
  cursor:pointer;
}
.img-thumb-wrap .del-img{
  position:absolute;top:-6px;right:-6px;
  background:var(--red);color:white;
  border:none;width:18px;height:18px;
  border-radius:50%;cursor:pointer;
  font-size:11px;display:flex;
  align-items:center;justify-content:center;
}
.upload-drop{
  border:2px dashed var(--border2);
  border-radius:6px;padding:20px;
  text-align:center;color:var(--muted);
  font-size:13px;cursor:pointer;
  transition:all .2s;background:var(--light);
}
.upload-drop:hover{border-color:var(--gold);color:var(--gold);background:rgba(184,146,74,.05)}
.upload-drop input[type=file]{display:none}
.upload-drop .upload-icon{font-size:28px;margin-bottom:6px;display:block}

/* Comments */
.comments-section{margin-top:4px}
.comments-section h4{
  font-size:13px;letter-spacing:.08em;
  color:var(--muted);margin-bottom:14px;
  text-transform:uppercase;
}
.comment-item{
  padding:12px 14px;background:var(--light);
  border-radius:4px;border-left:3px solid var(--gold);
  margin-bottom:10px;animation:fadeUp .3s ease;
}
.comment-meta{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:5px;
}
.comment-name{font-size:12px;font-weight:600;color:var(--gold)}
.comment-time{font-size:11px;color:var(--muted)}
.comment-text{font-size:13px;color:var(--text);line-height:1.6}
.no-comments{font-size:13px;color:var(--muted);font-style:italic;padding:10px 0}
.comment-form{margin-top:14px}
.cf-row{display:flex;gap:10px;margin-bottom:10px}
.cf-input{
  flex:1;padding:9px 12px;
  border:1px solid var(--border2);border-radius:3px;
  font-family:inherit;font-size:13px;
  color:var(--text);outline:none;background:white;
  transition:border-color .2s;
}
.cf-input:focus{border-color:var(--gold)}
textarea.cf-input{
  width:100%;min-height:80px;resize:vertical;
}
.cf-submit{
  padding:9px 22px;
  background:var(--ink);color:var(--gold2);
  border:none;border-radius:3px;
  font-family:inherit;font-size:13px;
  cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.cf-submit:hover{background:var(--gold);color:white}

/* Modal img gallery */
.modal-gallery{
  display:flex;gap:8px;
  padding:10px 14px;
  background:var(--warm);
  flex-wrap:wrap;
}
.modal-gallery-thumb{
  width:52px;height:52px;border-radius:3px;
  overflow:hidden;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s;
  flex-shrink:0;
}
.modal-gallery-thumb.active{border-color:var(--gold)}
.modal-gallery-thumb img{width:100%;height:100%;object-fit:cover}
.modal-gallery-add{
  width:52px;height:52px;border-radius:3px;
  border:2px dashed var(--border2);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;font-size:10px;
  color:var(--muted);gap:2px;
  transition:all .2s;flex-shrink:0;
}
.modal-gallery-add:hover{border-color:var(--gold);color:var(--gold)}
.modal-gallery-add input{display:none}

/* Responsive */
@media(max-width:700px){
  .topbar{padding:12px 16px}
  .main{padding:24px 16px 48px}
  .grid{grid-template-columns:1fr 1fr;gap:16px}
  .modal-body{padding:20px}
  .info-grid{grid-template-columns:1fr}
  .hero{padding:44px 20px 40px}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-tag">Finest Pearl &amp; Gemstone Collection</div>
  <h1>珍 珠 珠 宝<br><em>精品目录</em></h1>
  <div class="hero-line"></div>
  <div class="hero-sub">百件甄选珍品 · 源自自然之美</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="搜索名称、规格、描述…">
  </div>
  <div class="view-btns">
    <button class="vbtn active" id="gridBtn" title="卡片视图">⊞</button>
    <button class="vbtn" id="listBtn" title="列表视图">☰</button>
  </div>
  <div class="filter-wrap" id="filterWrap">
    <button class="fbtn active" data-cat="all">全部</button>
    <button class="fbtn" data-cat="akoya">Akoya</button>
    <button class="fbtn" data-cat="south">南洋珠</button>
    <button class="fbtn" data-cat="ruby">红宝石</button>
    <button class="fbtn" data-cat="sapphire">蓝宝石</button>
    <button class="fbtn" data-cat="emerald">祖母绿</button>
    <button class="fbtn" data-cat="diamond">钻石</button>
    <button class="fbtn" data-cat="cert">含证书</button>
  </div>
  <div class="count" id="countEl">100 件</div>
  <button onclick="exportComments()" style="padding:7px 14px;border:1px solid var(--border2);background:white;border-radius:3px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap" title="导出所有留言为文本文件">📥 导出留言</button>
</div>

<!-- MAIN -->
<div class="main">
  <div class="grid" id="gridView"></div>
  <div class="list-view" id="listView">
    <table class="list-table">
      <thead><tr>
        <th>图片</th><th>No.</th><th>名称</th><th>规格</th><th>介绍</th><th>证书</th><th>价格</th><th>操作</th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div id="emptyState" style="display:none;text-align:center;padding:80px 20px;color:var(--muted)">
    <div style="font-size:48px;margin-bottom:16px;opacity:.3">💎</div>
    <div style="font-size:16px">未找到匹配商品</div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-img-area" id="modalImgArea">
      <div class="modal-img-placeholder"><div class="big-gem">💎</div><span>暂无图片</span></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-gallery" id="modalGallery"></div>
    <div class="modal-body">
      <div class="modal-no" id="mNo"></div>
      <div class="modal-name" id="mName"></div>
      <div class="info-grid">
        <div class="info-item"><label>规格</label><p id="mSpec"></p></div>
        <div class="info-item"><label>证书</label><p id="mCert"></p></div>
        <div class="info-item" style="grid-column:1/-1"><label>介绍</label><p id="mDesc"></p></div>
      </div>
      <div class="modal-price-row">
        <div class="modal-price" id="mPrice"></div>
        <button class="modal-inquiry-btn" id="mInquiry">💬 留言咨询</button>
      </div>

      <!-- Upload -->
      <div class="upload-section">
        <h4>📷 商品图片</h4>
        <div class="uploaded-imgs" id="uploadedImgs"></div>
        <label class="upload-drop">
          <input type="file" accept="image/*" multiple id="fileInput">
          <span class="upload-icon">📁</span>
          点击或拖拽上传图片（支持多张）
        </label>
      </div>

      <!-- Comments -->
      <div class="comments-section">
        <h4>💬 留言咨询</h4>
        <div id="commentsList"></div>
        <div class="comment-form">
          <div class="cf-row">

// ─── Config ───
const GEM_ICONS = {akoya:'🔮',south:'🌕',ruby:'❤️',sapphire:'💙',emerald:'💚',diamond:'💎'};
const GEM_COLORS = {akoya:'#a78bfa',south:'#c9a96e',ruby:'#f87171',sapphire:'#60a5fa',emerald:'#34d399',diamond:'#e2e8f0'};

function getCats(r) {
  const s = (r[1]+r[2]+r[3]).toLowerCase();
  const c = [];
  if(s.includes('akoya')||s.includes('珍珠')||s.includes('马贝'))c.push('akoya');
  if(s.includes('南洋')||s.includes('澳白')||s.includes('茶金珠'))c.push('south');
  if(s.includes('红宝')||s.includes('鸽血红')||s.includes('珊瑚'))c.push('ruby');
  if(s.includes('蓝宝')||s.includes('海蓝宝')||s.includes('帕拉伊巴')||s.includes('蓝方'))c.push('sapphire');
  if(s.includes('祖母绿'))c.push('emerald');
  if(s.includes('钻石')||s.includes('黄钻')||s.includes('粉钻'))c.push('diamond');
  if(r[4]!=='—')c.push('cert');
  return c;
}

// ─── Persistent storage via localStorage ───
const STORAGE_KEY = 'jewelry_catalog_data';
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}
function saveStore(store) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
}

// In-memory images (base64 from Excel, not persisted in localStorage due to size)
const memImages = {};  // id -> [base64, ...]

function getItem(id) {
  const store = loadStore();
  if(!store[id]) store[id] = {extraImages:[], comments:[], currentImg:0};
  return store[id];
}
function saveItem(id, data) {
  const store = loadStore();
  store[id] = data;
  saveStore(store);
}

function getAllImages(id) {
  // Excel image first, then user-uploaded extras
  const excelImg = EXCEL_IMGS[String(id)];
  const extras = getItem(id).extraImages || [];
  const mem = memImages[id] || [];
  const all = [];
  if(excelImg) all.push(excelImg);
  all.push(...extras);
  all.push(...mem);
  return all;
}

function addExtraImage(id, dataUrl) {
  const d = getItem(id);
  // Store small images in localStorage, large ones in memory only
  if(dataUrl.length < 500000) {
    d.extraImages.push(dataUrl);
    saveItem(id, d);
  } else {
    if(!memImages[id]) memImages[id] = [];
    memImages[id].push(dataUrl);
  }
}

function deleteExtraImage(id, globalIdx) {
  const excelCount = EXCEL_IMGS[String(id)] ? 1 : 0;
  if(globalIdx < excelCount) return; // can't delete excel image
  const d = getItem(id);
  const extraIdx = globalIdx - excelCount;
  if(extraIdx < d.extraImages.length) {
    d.extraImages.splice(extraIdx, 1);
    saveItem(id, d);
  } else {
    const memIdx = extraIdx - d.extraImages.length;
    if(memImages[id]) memImages[id].splice(memIdx, 1);
  }
}

// ─── State ───
let currentView = 'grid', currentCat = 'all', searchStr = '';
let currentItem = null;   // currently open item id
let currentImgIdx = {};   // id -> current gallery index

// ─── Filter ───
function filtered() {
  return ITEMS.filter(r => {
    if(currentCat==='cert' && r[4]==='—') return false;
    if(currentCat!=='all' && currentCat!=='cert' && !getCats(r).includes(currentCat)) return false;
    if(searchStr) {
      const q = searchStr.toLowerCase();
      if(![r[1],r[2],r[3]].join(' ').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ─── RENDER ───
function render() {
  const data = filtered();
  document.getElementById('countEl').textContent = data.length + ' 件';
  const empty = document.getElementById('emptyState');
  empty.style.display = data.length ? 'none' : 'block';

  if(currentView === 'grid') {
    document.getElementById('gridView').style.display = 'grid';
    document.getElementById('listView').style.display = 'none';
    renderGrid(data);
  } else {
    document.getElementById('gridView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    renderList(data);
  }
}

function renderGrid(data) {
  const grid = document.getElementById('gridView');
  grid.innerHTML = data.map((r, i) => {
    const cats = getCats(r);
    const hasCert = r[4] !== '—';
    const hasPrice = r[5] !== '—';
    const imgs = getAllImages(r[0]);
    const imgSrc = imgs[0] || null;
    const mainCat = cats.filter(c=>c!=='cert')[0];
    const icon = GEM_ICONS[mainCat] || '💎';
    const delay = Math.min(i*20, 400);
    const commentCount = (getItem(r[0]).comments||[]).length;

    return `<div class="card" style="animation-delay:${delay}ms">
      <div class="card-img">
        ${imgSrc
          ? `<img src="${imgSrc}" alt="${r[1]}">`
          : `<div class="card-img-placeholder"><div class="gem-icon">${icon}</div><span>暂无图片</span></div>`}
        ${hasCert ? `<div class="cert-ribbon">🏅 ${r[4].replace('✅ ','')}</div>` : ''}
        ${imgs.length > 1 ? `<div class="img-count-badge">📷 ${imgs.length}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-no">No.${r[0]}</div>
        <div class="card-name">${r[1]}</div>
        <div class="card-spec">${r[2]}</div>
        <div class="card-desc">${r[3]}</div>
      </div>
      <div class="card-footer">
        <div class="card-price ${hasPrice?'':'na'}">${hasPrice ? r[5] : '价格面议'}</div>
        <button class="inquiry-btn" onclick="openModal(${r[0]})">
          查看详情${commentCount > 0 ? ` 💬${commentCount}` : ''}
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderList(data) {
  document.getElementById('listBody').innerHTML = data.map((r,i) => {
    const hasCert = r[4]!=='—', hasPrice = r[5]!=='—';
    const imgs = getAllImages(r[0]);
    const mainCat = getCats(r).filter(c=>c!=='cert')[0];
    const icon = GEM_ICONS[mainCat]||'💎';
    const delay = Math.min(i*15,300);
    return `<tr style="animation-delay:${delay}ms">
      <td><div class="lt-thumb">${imgs[0]?`<img src="${imgs[0]}">`:`<span style="font-size:22px">${icon}</span>`}</div></td>
      <td style="color:var(--gold);font-style:italic;font-family:'Playfair Display',serif">${r[0]}</td>
      <td><div class="lt-name">${r[1]}</div><div class="lt-spec">${r[2].substring(0,40)}${r[2].length>40?'…':''}</div></td>
      <td style="max-width:180px;font-size:12px;color:var(--muted)">${r[2]}</td>
      <td style="max-width:200px;font-size:13px">${r[3]}</td>
      <td>${hasCert?`<span style="font-size:11px;color:var(--gold);background:rgba(184,146,74,.1);padding:3px 8px;border-radius:2px">${r[4].replace('✅ ','')}</span>`:'<span style="color:#ccc;font-size:12px">—</span>'}</td>
      <td><div class="lt-price" style="${hasPrice?'':'font-size:13px;color:var(--muted);font-style:italic'}">${hasPrice?r[5]:'面议'}</div></td>
      <td><button class="inquiry-btn" onclick="openModal(${r[0]})" style="font-size:12px;padding:6px 14px">详情</button></td>
    </tr>`;
  }).join('');
}

// ─── MODAL ───
function openModal(id) {
  const r = ITEMS.find(x => x[0]===id);
  if(!r) return;
  currentItem = id;
  if(!currentImgIdx[id]) currentImgIdx[id] = 0;

  document.getElementById('mNo').textContent = 'No.' + r[0];
  document.getElementById('mName').textContent = r[1];
  document.getElementById('mSpec').textContent = r[2];
  document.getElementById('mCert').textContent = r[4]==='—' ? '暂无证书' : r[4];
  document.getElementById('mDesc').textContent = r[3];
  const hasPrice = r[5]!=='—';
  const priceEl = document.getElementById('mPrice');
  priceEl.textContent = hasPrice ? r[5] : '价格面议，欢迎咨询';
  priceEl.className = 'modal-price' + (hasPrice ? '' : ' na');

  refreshModalImgs();
  refreshComments();

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
  currentItem = null;
}

function refreshModalImgs() {
  if(!currentItem) return;
  const id = currentItem;
  const imgs = getAllImages(id);
  const idx = Math.min(currentImgIdx[id]||0, Math.max(imgs.length-1,0));
  currentImgIdx[id] = idx;

  // Main image
  const imgArea = document.getElementById('modalImgArea');
  const closeBtn = document.getElementById('modalClose');
  imgArea.innerHTML = '';
  if(imgs.length > 0) {
    const img = document.createElement('img');
    img.src = imgs[idx];
    img.style.cssText = 'width:100%;height:100%;object-fit:cover';
    imgArea.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'modal-img-placeholder';
    ph.innerHTML = '<div class="big-gem">💎</div><span>暂无图片</span>';
    imgArea.appendChild(ph);
  }
  imgArea.appendChild(closeBtn);

  // Gallery thumbnails
  const gallery = document.getElementById('modalGallery');
  if(imgs.length === 0) {
    gallery.style.display = 'none';
    gallery.innerHTML = '';
  } else {
    gallery.style.display = 'flex';
    gallery.innerHTML = imgs.map((src,i) =>
      `<div class="modal-gallery-thumb${i===idx?' active':''}" onclick="switchImg(${i})">
        <img src="${src}">
        ${i > 0 ? `<button onclick="event.stopPropagation();deleteImg(${i})" style="position:absolute;top:-5px;right:-5px;background:#c0392b;color:white;border:none;width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:1">×</button>` : ''}
      </div>`
    ).join('') +
    `<label class="modal-gallery-add" title="上传图片">
      <input type="file" accept="image/*" multiple style="display:none" onchange="handleGalleryUpload(this)">
      <span style="font-size:20px">+</span><span>上传</span>
    </label>`;
    // Make gallery thumbs relative for delete btn
    gallery.querySelectorAll('.modal-gallery-thumb').forEach(t => t.style.position='relative');
  }

  // Upload zone imgs preview
  const uploadedImgs = document.getElementById('uploadedImgs');
  const extras = getAllImages(id).slice(1);
  uploadedImgs.innerHTML = extras.length ? extras.map((src,i) =>
    `<div class="img-thumb-wrap">
      <img src="${src}" onclick="switchImg(${i+1})">
      <button class="del-img" onclick="deleteImg(${i+1})">×</button>
    </div>`
  ).join('') : '<span style="font-size:12px;color:var(--muted)">暂无额外上传图片</span>';
}

function switchImg(idx) {
  if(!currentItem) return;
  currentImgIdx[currentItem] = idx;
  refreshModalImgs();
}

function deleteImg(globalIdx) {
  if(!currentItem) return;
  deleteExtraImage(currentItem, globalIdx);
  const imgs = getAllImages(currentItem);
  currentImgIdx[currentItem] = Math.min(currentImgIdx[currentItem]||0, Math.max(imgs.length-1,0));
  refreshModalImgs();
  render();
}

function handleGalleryUpload(input) {
  if(!currentItem) return;
  const id = currentItem;
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      addExtraImage(id, e.target.result);
      refreshModalImgs();
      render();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

// ─── COMMENTS ───
function refreshComments() {
  if(!currentItem) return;
  const d = getItem(currentItem);
  const list = document.getElementById('commentsList');
  const comments = d.comments || [];
  if(!comments.length) {
    list.innerHTML = '<div class="no-comments">暂无留言，欢迎第一个咨询～</div>';
    return;
  }
  list.innerHTML = comments.map((c,i) =>
    `<div class="comment-item">
      <div class="comment-meta">
        <span class="comment-name">👤 ${c.name}</span>
        <span class="comment-time">${c.time}</span>
      </div>
      ${c.contact ? `<div style="font-size:11px;color:var(--muted);margin-bottom:4px">联系：${c.contact}</div>` : ''}
      <div class="comment-text">${c.text}</div>
    </div>`
  ).join('');
  list.scrollTop = list.scrollHeight;
}

function submitComment() {
  if(!currentItem) return;
  const name = (document.getElementById('cfName').value.trim()) || '匿名买家';
  const contact = document.getElementById('cfContact').value.trim();
  const text = document.getElementById('cfText').value.trim();
  if(!text) { document.getElementById('cfText').focus(); return; }

  const d = getItem(currentItem);
  if(!d.comments) d.comments = [];
  const now = new Date();
  d.comments.push({
    name, contact, text,
    time: now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  });
  saveItem(currentItem, d);

  document.getElementById('cfName').value = '';
  document.getElementById('cfContact').value = '';
  document.getElementById('cfText').value = '';
  refreshComments();
  render(); // update comment count on card
}

// ─── EXPORT COMMENTS ───
function exportComments() {
  const store = loadStore();
  let rows = ['商品编号\t商品名称\t留言人\t联系方式\t留言内容\t时间'];
  Object.keys(store).forEach(id => {
    const item = ITEMS.find(x=>x[0]===+id);
    const name = item ? item[1] : `商品${id}`;
    (store[id].comments||[]).forEach(c => {
      rows.push([id, name, c.name, c.contact||'', c.text, c.time].join('\t'));
    });
  });
  if(rows.length===1){ alert('暂无留言记录'); return; }
  const blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '珠宝留言记录_' + new Date().toLocaleDateString('zh-CN').replace(/\//g,'-') + '.txt';
  a.click();
}

// ─── EVENT LISTENERS ───
document.getElementById('searchInput').addEventListener('input', e => {
  searchStr = e.target.value.trim();
  render();
});

document.getElementById('filterWrap').addEventListener('click', e => {
  const btn = e.target.closest('.fbtn');
  if(!btn) return;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

document.getElementById('gridBtn').addEventListener('click', () => {
  currentView='grid';
  document.getElementById('gridBtn').classList.add('active');
  document.getElementById('listBtn').classList.remove('active');
  render();
});
document.getElementById('listBtn').addEventListener('click', () => {
  currentView='list';
  document.getElementById('listBtn').classList.add('active');
  document.getElementById('gridBtn').classList.remove('active');
  render();
});

// Close modal
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target.id === 'modalOverlay') closeModal();
});

// Comment submit
document.getElementById('cfSubmit').addEventListener('click', submitComment);
document.getElementById('cfText').addEventListener('keydown', e => {
  if(e.ctrlKey && e.key==='Enter') submitComment();
});

// Scroll to comment box
document.getElementById('mInquiry').addEventListener('click', () => {
  setTimeout(() => {
    document.getElementById('cfName').scrollIntoView({behavior:'smooth',block:'center'});
    document.getElementById('cfName').focus();
  }, 100);
});

// File upload drag & drop
const dropZone = document.querySelector('.upload-drop');
if(dropZone) {
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='var(--gold)'; });
  dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor=''; });
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.borderColor='';
    if(currentItem) handleGalleryUpload({files: e.dataTransfer.files, value:''});
  });
}
document.getElementById('fileInput').addEventListener('change', e => {
  handleGalleryUpload(e.target);
});

// Init
render();

</script>
</body>
</html>
